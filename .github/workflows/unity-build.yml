# =============================================================================
# Hermes Game Engine — Unity Build Pipeline
# =============================================================================
# Triggers:
#   - Push to main or master
#   - Manual trigger via workflow_dispatch (with build target selection)
#
# Matrix targets: WebGL, StandaloneWindows64, Android
# =============================================================================

name: Unity Build Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Override the matrix — build a single target only'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - WebGL
          - StandaloneWindows64
          - Android
      build_options:
        description: 'Extra Unity batchmode args (e.g., -nographics -force-vulkan)'
        required: false
        default: ''
        type: string

env:
  UNITY_VERSION: 2022.3.17f1

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [WebGL, StandaloneWindows64, Android]
        include:
          - target: WebGL
            unity_build_method: BuildPipeline.BuildPlayerWebGL
            artifact_name: hermes-webgl
            artifact_path: Builds/WebGL
          - target: StandaloneWindows64
            unity_build_method: BuildPipeline.BuildPlayerStandaloneWindows64
            artifact_name: hermes-windows64
            artifact_path: Builds/Windows
          - target: Android
            unity_build_method: BuildPipeline.BuildPlayerAndroid
            artifact_name: hermes-android
            artifact_path: Builds/Android

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 💾 Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.target }}-
            Library-

      # ---------------------------------------------------
      # Unity Personal license activation via Named User Licensing
      # (email + password — no serial needed for Personal)
      # ---------------------------------------------------
      - name: 🔑 Activate Unity License (Personal / NUL)
        uses: game-ci/unity-activate@v2
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: 🔨 Unity Build — ${{ matrix.target }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
        with:
          targetPlatform: ${{ matrix.target }}
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: ${{ matrix.unity_build_method }}
          versioning: Semantic
          androidAppBundle: false
          allowDirtyBuild: false
          customParameters: ${{ github.event.inputs.build_options || '' }}

      - name: 📤 Upload Build Artifact — ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

      - name: 🌐 Package WebGL Downloadable
        if: matrix.target == 'WebGL'
        run: |
          cd Builds/WebGL
          zip -r ../../hermes-webgl.zip ./*
        shell: bash

      - name: 🌐 Upload WebGL Zip Artifact
        if: matrix.target == 'WebGL'
        uses: actions/upload-artifact@v4
        with:
          name: hermes-webgl-downloadable
          path: hermes-webgl.zip

  # =========================================================================
  # Deploy WebGL build to games.pembantu.online (VPS)
  # =========================================================================
  deploy-webgl:
    name: 🚀 Deploy WebGL → VPS
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.target_platform == '' || github.event.inputs.target_platform == 'WebGL')
    steps:
      - name: 📥 Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: hermes-webgl
          path: webgl-build

      - name: 🔑 Install SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/dealpulse_key
          chmod 600 ~/.ssh/dealpulse_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to VPS
        run: |
          GAME_NAME="space-dodger"
          ssh -i ~/.ssh/dealpulse_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo mkdir -p /opt/games/builds/$GAME_NAME"
          scp -i ~/.ssh/dealpulse_key -r webgl-build/* \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/games/builds/$GAME_NAME/
          ssh -i ~/.ssh/dealpulse_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo chown -R nginx:nginx /opt/games/builds/$GAME_NAME"
          echo "Deployed to: https://games.pembantu.online/builds/$GAME_NAME/"

  # =========================================================================
  # Deploy WebGL build to itch.io via butler
  # =========================================================================
  deploy-itchio:
    name: 🎮 Deploy WebGL → itch.io
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.target_platform == '' || github.event.inputs.target_platform == 'WebGL')
    steps:
      - name: 📥 Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: hermes-webgl
          path: webgl-build

      - name: ⬇️ Install Butler
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST
          unzip butler.zip
          chmod +x butler
          ./butler version

      - name: 🚀 Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ secrets.ITCH_USER }}
          ITCH_GAME: ${{ secrets.ITCH_GAME }}
        run: |
          export PATH="$PATH:$(pwd)"
          butler push --if-changed webgl-build "$ITCH_USER/$ITCH_GAME:html5"
          echo "✅ Published to https://$ITCH_USER.itch.io/$ITCH_GAME"

  # =========================================================================
  # Notification job
  # =========================================================================
  notify:
    name: 📬 Notify
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Dispatch status
        run: |
          STATUS='✅ Success'
          if [ '${{ needs.build.result }}' != 'success' ]; then
            STATUS='❌ Failed'
          fi
          echo "Build result: $STATUS"
          echo "ref: ${{ github.ref }}"
          echo "commit: ${{ github.sha }}"